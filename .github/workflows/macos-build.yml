name: macOS build

on:
  push:
    branches:
      - ci/macos-build
    paths:
      - '**'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mumble-tauri/ui/package-lock.json

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Install frontend dependencies
        run: npm ci
        working-directory: crates/mumble-tauri/ui

      - name: Build macOS app and DMG
        run: cargo tauri build --bundles app,dmg
        working-directory: crates/mumble-tauri

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FancyMumble-macOS
          path: |
            crates/mumble-tauri/target/release/bundle/macos/*.app
            crates/mumble-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
